name: Check Kapani
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kapani-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:pages
